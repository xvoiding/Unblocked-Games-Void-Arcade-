<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Void Retro</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:15px/1.5 system-ui,sans-serif;overflow:hidden}
#game{width:100%;height:100%}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;pointer-events:none}
#msg.hide{display:none}
#msg b{display:block;font-size:18px;color:#fff;margin-bottom:6px}
</style>
</head>
<body>
<div id="game"></div>
<div id="msg"><div><b id="mt">Loading...</b><span id="ms"></span></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var id=q.get('id'),core=q.get('core')||'',accent=q.get('ac')||'#ffffff';
  var msg=document.getElementById('msg');
  function say(t,s){document.getElementById('mt').textContent=t;document.getElementById('ms').textContent=s||'';msg.classList.remove('hide')}
  function fail(s){say('Could not start this game',s)}
  if(!id||!core)return fail('Missing game or system.');
  var req=indexedDB.open('void-retro',1);
  req.onupgradeneeded=function(){req.result.createObjectStore('roms',{keyPath:'id'})};
  req.onerror=function(){fail('Your browser blocked local storage.')};
  req.onsuccess=function(){
    var tx=req.result.transaction('roms'),get=tx.objectStore('roms').get(id);
    get.onerror=function(){fail('Could not read the game from this device.')};
    get.onsuccess=function(){
      var rom=get.result;
      if(!rom||!rom.blob)return fail('That game is no longer on this device.');
      var url=URL.createObjectURL(rom.blob);
      window.EJS_player='#game';
      window.EJS_core=core;
      window.EJS_gameUrl=url;
      window.EJS_gameName=String(rom.name||'game').replace(/\.[^.]+$/,'');
      window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
      window.EJS_color=accent;
      window.EJS_startOnLoaded=true;
      window.EJS_language='en-US';
      window.EJS_backgroundColor='#000000';
      say('Loading '+window.EJS_gameName+'...','Downloading the emulator, one moment.');
      window.EJS_onGameStart=function(){msg.classList.add('hide')};
      var s=document.createElement('script');
      s.src=window.EJS_pathtodata+'loader.js';
      s.onerror=function(){fail('The emulator could not be downloaded. Check your connection and try again.')};
      document.body.appendChild(s);
    };
  };
})();
</script>
</body>
</html>
