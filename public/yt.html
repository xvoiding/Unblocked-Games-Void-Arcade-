<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube</title>
<style>
:root{--bg:#000;--raise:#0b0b0d;--raise2:#131316;--edge:rgba(255,255,255,.09);--edge2:rgba(255,255,255,.17);--ink:#f4f4f5;--mist:#a1a1aa;--dim:#71717a;--ac:#f4f4f5;--ac-rgb:244,244,245;--on-ac:#000;--hov:rgba(255,255,255,.07);--body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--edge)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.03em;font-size:18px}
.logo i{width:30px;height:22px;border-radius:7px;background:var(--ac);display:grid;place-items:center}
.logo i:after{content:"";border-left:8px solid var(--on-ac);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
form{flex:1;max-width:640px;display:flex}
form input{flex:1;min-width:0;background:var(--raise);border:1px solid var(--edge2);border-right:0;color:var(--ink);padding:10px 16px;border-radius:99px 0 0 99px;outline:none;font:inherit}
form input:focus{border-color:rgba(var(--ac-rgb),.7)}
form button{background:var(--raise2);border:1px solid var(--edge2);padding:0 18px;border-radius:0 99px 99px 0;font-weight:600}
form button:hover{background:var(--hov)}
main{padding:18px;max-width:1500px;margin:0 auto}
h2{font-size:18px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px}
.card{display:block}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--raise2);border:1px solid var(--edge)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:2px 6px;border-radius:6px;font-weight:600}
.card h3{font-size:15px;line-height:1.3;margin:10px 0 3px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mist);display:block;font-size:13px}
.card:hover .th{border-color:var(--edge2)}
.msg{color:var(--mist);text-align:center;padding:60px 10px}
.more{display:block;margin:28px auto 8px;background:var(--raise);border:1px solid var(--edge2);padding:10px 26px;border-radius:99px;font-weight:600}
.more:hover{background:var(--raise2)}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.pl{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--edge)}
.pl video,.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar select,.bar button{background:var(--raise);border:1px solid var(--edge2);color:var(--ink);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13.5px}
.bar button:hover{background:var(--raise2)}
.watch h1{font-size:20px;line-height:1.3;margin:14px 0 4px}
.meta{color:var(--mist);font-size:14px}
.desc{white-space:pre-wrap;word-break:break-word;color:var(--mist);background:var(--raise);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;margin-top:14px;font-size:14px}
.rel{display:grid;gap:14px}
.rel .card{display:grid;grid-template-columns:168px 1fr;gap:12px}
.rel .card h3{margin:0 0 3px;font-size:14px}
@media (max-width:980px){.watch{grid-template-columns:1fr}}
@media (max-width:560px){main{padding:12px}header{padding:10px 12px}.logo span{display:none}.grid{grid-template-columns:1fr}.rel .card{grid-template-columns:140px 1fr}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/yt.html"><i></i><span>YouTube</span></a>
  <form action="/yt.html" method="get"><input id="q" name="q" placeholder="Search" autocomplete="off" spellcheck="false" enterkeyhint="search"><button>Search</button></form>
</header>
<main id="app"><div class="msg">Loading...</div></main>
<script>
(function(){
  // Match the site's current theme by copying its colours from the page that holds this one.
  try{
    var cs=getComputedStyle(parent.document.documentElement),r=document.documentElement.style;
    ['--bg','--raise','--raise2','--edge','--edge2','--ink','--mist','--dim','--ac','--ac-rgb','--on-ac','--hov','--body'].forEach(function(k){var v=cs.getPropertyValue(k);if(v&&v.trim())r.setProperty(k,v.trim())});
  }catch(e){}
  var $=function(s){return document.querySelector(s)},app=$('#app');
  var p=new URLSearchParams(location.search),q=p.get('q'),v=p.get('v');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  function dur(s){if(s==null)return'';var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
  function when(w){return /^\d{4}-\d\d-\d\d/.test(w||'')?new Date(w).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):(w||'')}
  function num(n){if(n==null)return'';if(n>=1e9)return(n/1e9).toFixed(1)+'B views';if(n>=1e6)return(n/1e6).toFixed(1)+'M views';if(n>=1e3)return(n/1e3).toFixed(1)+'K views';return n+' views'}
  function api(qs){return fetch('/api/yt?'+qs).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'failed');return j})})}
  function card(x){return '<a class="card" href="/yt.html?v='+esc(x.id)+'"><div class="th"><img loading="lazy" alt="" src="'+esc(x.thumb)+'">'+(x.dur?'<b>'+dur(x.dur)+'</b>':'')+'</div><h3>'+esc(x.title)+'</h3><small>'+esc(x.by)+'</small><small>'+[num(x.views),esc(when(x.when))].filter(Boolean).join(' · ')+'</small></a>'}
  function fail(e){app.innerHTML='<div class="msg">'+esc(e&&e.message||'Something went wrong.')+'</div>'}

  if(v){
    document.title='YouTube';
    app.innerHTML='<div class="msg">Loading video...</div>';
    api('a=streams&v='+encodeURIComponent(v)).then(function(d){
      if(d.blocked){app.innerHTML='<div class="msg">This video is blocked.</div>';return}
      document.title=d.title+' - YouTube';
      var qual=(d.videos||[]);
      app.innerHTML='<div class="watch"><div><div class="pl" id="pl"></div><div class="bar" id="bar"></div><h1>'+esc(d.title)+'</h1><div class="meta">'+esc(d.by)+' · '+[num(d.views),esc(when(d.when))].filter(Boolean).join(' · ')+'</div>'+(d.desc?'<div class="desc">'+esc(d.desc)+'</div>':'')+'</div><div class="rel">'+(d.related||[]).map(card).join('')+'</div></div>';
      var pl=$('#pl'),bar=$('#bar'),embed=false;
      function useEmbed(){embed=true;pl.innerHTML='<iframe allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(d.id)+'?autoplay=1&rel=0"></iframe>';paint()}
      function useVideo(i){embed=false;var s=qual[i];pl.innerHTML='<video controls autoplay playsinline></video>';var el=pl.firstChild;el.onerror=function(){useEmbed()};el.src=s.url;paint(i)}
      function paint(i){
        var h='';
        if(!embed&&qual.length){h+='<select id="qs">'+qual.map(function(s,k){return'<option value="'+k+'"'+(k===i?' selected':'')+'>'+esc(s.q||'Auto')+'</option>'}).join('')+'</select>';h+='<button id="sw">Use YouTube player</button>'}
        else if(qual.length){h+='<button id="sw">Use fast player</button>'}
        bar.innerHTML=h;
        var qs=$('#qs');if(qs)qs.onchange=function(){var t=pl.firstChild&&pl.firstChild.currentTime||0;useVideo(+qs.value);var el=pl.firstChild;el.addEventListener('loadedmetadata',function(){try{el.currentTime=t}catch(e){}},{once:true})};
        var sw=$('#sw');if(sw)sw.onclick=function(){if(embed)useVideo(0);else useEmbed()};
      }
      var start=qual.findIndex(function(s){return s.h>0&&s.h<=720});
      if(qual.length&&!d.live)useVideo(start>-1?start:0);else useEmbed();
    }).catch(function(){
      // The data source couldn't read this video, so use YouTube's own player instead.
      document.title='YouTube';
      app.innerHTML='<div class="watch"><div><div class="pl"><iframe allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v)+'?autoplay=1&rel=0"></iframe></div><div class="bar"><span class="meta">Playing with the YouTube player.</span></div></div></div>';
    });
  }else{
    var next=null,term=(q||'').trim();
    if(q!==null)$('#q').value=q;
    if(term){
      document.title=term+' - YouTube';
      app.innerHTML='<h2>Results for “'+esc(term)+'”</h2><div class="grid" id="g"></div><div id="mm"></div>';
      var load=function(tok){
        api('a=search&q='+encodeURIComponent(term)+(tok?'&page='+encodeURIComponent(tok):'')).then(function(d){
          if(d.blocked){app.innerHTML='<div class="msg">That search is blocked.</div>';return}
          var g=$('#g');if(!d.items.length&&!tok){g.outerHTML='<div class="msg">No results.</div>';return}
          g.insertAdjacentHTML('beforeend',d.items.map(card).join(''));
          next=d.next;$('#mm').innerHTML=next?'<button class="more" id="more">More results</button>':'';
          var b=$('#more');if(b)b.onclick=function(){b.disabled=true;b.textContent='Loading...';load(next)};
        }).catch(fail);
      };
      load();
    }else{
      app.innerHTML='<h2>Trending</h2><div class="grid" id="g"></div>';
      api('a=trending').then(function(d){$('#g').innerHTML=d.items.length?d.items.map(card).join(''):'<div class="msg">Nothing here right now.</div>'}).catch(fail);
    }
  }
})();
</script>
</body>
</html>
