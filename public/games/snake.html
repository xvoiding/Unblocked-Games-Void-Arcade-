<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title>
<style>
html,body{margin:0;height:100%;background:#070708;color:#f4f4f5;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;touch-action:none}
canvas{border:1px solid #2b2b32;border-radius:14px;max-width:92vw;max-height:78vh;aspect-ratio:1;background:#0b0b0d}
#s{letter-spacing:.1em;color:#8b8b95}#s b{color:#fff}
</style></head><body>
<div id="s">SCORE <b id="sc">0</b> · BEST <b id="bs">0</b></div>
<canvas id="c" width="440" height="440"></canvas>
<div style="color:#5a5a63">arrows / WASD / swipe · space to restart</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=22,S=20;
let sn,d,nd,f,sc,best=+localStorage.getItem('snakebest')||0,dead,last=0,speed=95;
document.getElementById('bs').textContent=best;
function reset(){sn=[{x:11,y:11},{x:10,y:11},{x:9,y:11}];d=nd={x:1,y:0};sc=0;dead=false;speed=95;food();document.getElementById('sc').textContent=0}
function food(){do{f={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(p=>p.x==f.x&&p.y==f.y))}
function step(){
  d=nd;const h={x:sn[0].x+d.x,y:sn[0].y+d.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(p=>p.x==h.x&&p.y==h.y)){dead=true;if(sc>best){best=sc;localStorage.setItem('snakebest',best);document.getElementById('bs').textContent=best}return}
  sn.unshift(h);
  if(h.x==f.x&&h.y==f.y){sc++;document.getElementById('sc').textContent=sc;speed=Math.max(55,speed-1.5);food()}else sn.pop();
}
function draw(){
  x.fillStyle='#0b0b0d';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#16161a';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2==0)x.fillRect(i*S,j*S,S,S);
  x.fillStyle='#fff';x.beginPath();x.arc(f.x*S+S/2,f.y*S+S/2,S/3,0,7);x.fill();
  sn.forEach((p,i)=>{x.fillStyle=dead?'#555':`rgba(255,255,255,${Math.max(.35,1-i/sn.length*.65)})`;x.beginPath();x.roundRect(p.x*S+1,p.y*S+1,S-2,S-2,5);x.fill()});
  if(dead){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='700 22px ui-monospace,monospace';x.textAlign='center';x.fillText('GAME OVER',c.width/2,c.height/2-4);x.font='13px ui-monospace,monospace';x.fillStyle='#8b8b95';x.fillText('space or tap to restart',c.width/2,c.height/2+22)}
}
function loop(t){if(!dead&&t-last>speed){last=t;step()}draw();requestAnimationFrame(loop)}
function turn(dx,dy){if(dead)return;if(dx&&d.x)return;if(dy&&d.y)return;nd={x:dx,y:dy}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k=='arrowup'||k=='w')turn(0,-1);else if(k=='arrowdown'||k=='s')turn(0,1);else if(k=='arrowleft'||k=='a')turn(-1,0);else if(k=='arrowright'||k=='d')turn(1,0);
  else if(k==' '&&dead)reset();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault()});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;if(dead)reset()},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)});
reset();requestAnimationFrame(loop);
</script></body></html>
