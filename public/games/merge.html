<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge</title>
<style>
html,body{margin:0;height:100%;background:#070708;color:#f4f4f5;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#s{letter-spacing:.1em;color:#8b8b95}#s b{color:#fff}
#wrap{position:relative}
#board{--g:10px;--c:min(19vmin,92px);display:grid;grid-template-columns:repeat(4,var(--c));gap:var(--g);padding:var(--g);background:#0f0f12;border:1px solid #2b2b32;border-radius:16px}
.cell{width:var(--c);height:var(--c);border-radius:10px;background:#17171b;display:grid;place-items:center;font-weight:800;font-size:calc(var(--c)*.38)}
.cell.pop{animation:pop .18s ease-out}.cell.new{animation:newc .22s ease-out}
@keyframes pop{50%{transform:scale(1.14)}}@keyframes newc{from{transform:scale(.4);opacity:0}}
button{background:#fff;color:#000;border:0;border-radius:10px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .2s}
button:hover{transform:translateY(-1px)}
#msg{position:absolute;inset:0;border-radius:16px;display:none;place-items:center;background:rgba(0,0,0,.72);font-size:22px;font-weight:800;letter-spacing:.1em}
</style></head><body>
<div id="s">SCORE <b id="sc">0</b> · BEST <b id="bs">0</b></div>
<div id="wrap"><div id="board"></div><div id="msg">GAME OVER</div></div>
<button id="rs">New game</button>
<div style="color:#5a5a63">arrows / WASD / swipe</div>
<script>
const N=4,$=id=>document.getElementById(id);
let g,sc,best=+localStorage.getItem('mergebest')||0,over,pop=new Set(),fresh=-1;
function newGame(){g=Array.from({length:N},()=>Array(N).fill(0));sc=0;over=false;fresh=-1;pop.clear();add();add();$('msg').style.display='none';render()}
function add(){const e=[];for(let r=0;r<N;r++)for(let q=0;q<N;q++)if(!g[r][q])e.push([r,q]);if(!e.length)return;const [r,q]=e[Math.random()*e.length|0];g[r][q]=Math.random()<.9?2:4;fresh=r*N+q}
function slide(v){const a=v.filter(Boolean),m=[];let p=0;for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){a[i]*=2;p+=a[i];a.splice(i+1,1);m.push(i)}}while(a.length<N)a.push(0);return{a,p,m}}
function line(d,k){const c=[];for(let i=0;i<N;i++)c.push(d===0?[k,i]:d===2?[k,N-1-i]:d===1?[i,k]:[N-1-i,k]);return c}
function canMove(){for(let r=0;r<N;r++)for(let q=0;q<N;q++){if(!g[r][q])return true;if(q<N-1&&g[r][q]===g[r][q+1])return true;if(r<N-1&&g[r][q]===g[r+1][q])return true}return false}
function move(d){
  if(over)return;let moved=false,pts=0;pop.clear();fresh=-1;
  for(let k=0;k<N;k++){const c=line(d,k),{a,p,m}=slide(c.map(([r,q])=>g[r][q]));pts+=p;
    a.forEach((v,i)=>{const [r,q]=c[i];if(g[r][q]!==v){moved=true;g[r][q]=v}});
    m.forEach(i=>{const [r,q]=c[i];pop.add(r*N+q)})}
  if(!moved)return;
  sc+=pts;if(sc>best){best=sc;localStorage.setItem('mergebest',best)}
  add();render();
  if(!canMove()){over=true;$('msg').style.display='grid'}
}
function render(){
  const b=$('board');b.innerHTML='';
  g.forEach((row,r)=>row.forEach((v,q)=>{
    const d=document.createElement('div');
    d.className='cell'+(fresh===r*N+q?' new':'')+(pop.has(r*N+q)?' pop':'');
    if(v){const l=Math.min(96,16+Math.log2(v)*7.5);d.style.background=`hsl(0 0% ${l}%)`;d.style.color=l>55?'#000':'#fff';d.textContent=v;if(v>=1024)d.style.fontSize='calc(var(--c)*.28)'}
    b.appendChild(d)}));
  $('sc').textContent=sc;$('bs').textContent=best;
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),m={arrowleft:0,a:0,arrowup:1,w:1,arrowright:2,d:2,arrowdown:3,s:3};
  if(k in m){e.preventDefault();move(m[k])}else if(k==='enter'&&over)newGame()});
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?2:0):move(dy>0?3:1)});
$('rs').onclick=newGame;newGame();
</script></body></html>
