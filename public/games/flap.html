<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flap</title>
<style>
html,body{margin:0;height:100%;background:#070708;color:#f4f4f5;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{border:1px solid #2b2b32;border-radius:14px;background:#0b0b0d;max-width:94vw;max-height:86vh;cursor:pointer}
</style></head><body>
<canvas id="c" width="360" height="540"></canvas>
<div style="color:#5a5a63">space / click / tap to flap</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=540,G=.42,J=-7,PW=58,GAP=156,SPD=2.5,FLOOR=H-44,BX=84,BR=13;
let b,pipes,score,best=+localStorage.getItem('flapbest')||0,state,frames,acc=0,last=0,deadAt=0;
function reset(){b={y:H/2-20,v:0};pipes=[];score=0;state='ready';frames=0}
function flap(){
  if(state==='dead'){if(performance.now()-deadAt>450)reset();return}
  if(state==='ready'){state='play';frames=0}
  b.v=J;
}
function die(){state='dead';deadAt=performance.now();if(score>best){best=score;localStorage.setItem('flapbest',best)}}
function step(){
  frames++;
  if(state==='ready'){b.y=H/2-20+Math.sin(frames/12)*6;return}
  if(state==='dead'){if(b.y+BR<FLOOR){b.v+=G;b.y+=b.v}return}
  b.v+=G;b.y+=b.v;
  if(frames%92===1){pipes.push({x:W+10,top:70+Math.random()*(FLOOR-GAP-140),done:false})}
  pipes.forEach(p=>p.x-=SPD);pipes=pipes.filter(p=>p.x>-PW);
  for(const p of pipes){
    if(!p.done&&p.x+PW<BX-BR){p.done=true;score++}
    if(BX+BR>p.x&&BX-BR<p.x+PW&&(b.y-BR<p.top||b.y+BR>p.top+GAP)){die();return}
  }
  if(b.y+BR>FLOOR||b.y<-30)die();
}
function pipe(p){
  x.fillStyle='#e9e9ee';
  x.beginPath();x.roundRect(p.x,-10,PW,p.top+10,[0,0,8,8]);x.fill();
  x.beginPath();x.roundRect(p.x,p.top+GAP,PW,FLOOR-p.top-GAP+10,[8,8,0,0]);x.fill();
  x.fillStyle='#bfbfc7';
  x.fillRect(p.x-4,p.top-16,PW+8,16);x.fillRect(p.x-4,p.top+GAP,PW+8,16);
}
function draw(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c0c10');g.addColorStop(1,'#16161c');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<24;i++){const sx=(i*97+(frames*.2))%W,sy=(i*53)%(FLOOR-40);x.fillRect(W-sx,sy,2,2)}
  pipes.forEach(pipe);
  x.fillStyle='#101014';x.fillRect(0,FLOOR,W,H-FLOOR);
  x.fillStyle='#2b2b32';x.fillRect(0,FLOOR,W,2);
  x.save();x.translate(BX,b.y);x.rotate(Math.max(-.5,Math.min(1,b.v*.07)));
  x.fillStyle='#fff';x.beginPath();x.arc(0,0,BR,0,7);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(5,-3,2.6,0,7);x.fill();
  x.fillStyle='#8b8b95';x.beginPath();x.moveTo(-9,2);x.lineTo(-20,-3+Math.sin(frames/3)*5);x.lineTo(-9,8);x.fill();
  x.restore();
  x.fillStyle='#fff';x.textAlign='center';x.font='800 44px ui-monospace,monospace';
  if(state!=='ready')x.fillText(score,W/2,84);
  if(state==='ready'){x.font='700 20px ui-monospace,monospace';x.fillText('FLAP',W/2,H/2-80);x.font='13px ui-monospace,monospace';x.fillStyle='#8b8b95';x.fillText('tap or press space',W/2,H/2-56)}
  if(state==='dead'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='800 26px ui-monospace,monospace';x.fillText('GAME OVER',W/2,H/2-30);x.font='15px ui-monospace,monospace';x.fillText('score '+score+'  ·  best '+best,W/2,H/2);x.fillStyle='#8b8b95';x.font='13px ui-monospace,monospace';x.fillText('tap to retry',W/2,H/2+28)}
}
function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=16.667){acc-=16.667;step()}
  draw();requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();if(!e.repeat)flap()}});
c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
reset();requestAnimationFrame(loop);
</script></body></html>
