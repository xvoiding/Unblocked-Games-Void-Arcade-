<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout</title>
<style>
html,body{margin:0;height:100%;background:#070708;color:#f4f4f5;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;touch-action:none}
canvas{border:1px solid #2b2b32;border-radius:14px;max-width:94vw;max-height:78vh;background:#0b0b0d}
#s{letter-spacing:.1em;color:#8b8b95}#s b{color:#fff}
</style></head><body>
<div id="s">SCORE <b id="sc">0</b> · LIVES <b id="lv">3</b></div>
<canvas id="c" width="560" height="420"></canvas>
<div style="color:#5a5a63">mouse / touch / arrows to move · click or space to launch</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height;
const R=7,C=10,BW=(W-40)/C-4,BH=18;
let px,pw,bx,by,vx,vy,bricks,sc,lives,live,over,keys={};
function reset(){px=W/2;pw=96;sc=0;lives=3;over=false;bricks=[];
  for(let r=0;r<6;r++)for(let i=0;i<C;i++)bricks.push({x:20+i*(BW+4),y:50+r*(BH+4),a:1,v:6-r});
  park();upd()}
function park(){live=false;bx=px;by=H-40;vx=0;vy=0}
function launch(){if(live||over){if(over)reset();return}live=true;vx=(Math.random()<.5?-1:1)*3;vy=-4.2}
function upd(){document.getElementById('sc').textContent=sc;document.getElementById('lv').textContent=lives}
function step(){
  if(keys.ArrowLeft||keys.a)px-=7;if(keys.ArrowRight||keys.d)px+=7;
  px=Math.max(pw/2,Math.min(W-pw/2,px));
  if(!live){bx=px;return}
  bx+=vx;by+=vy;
  if(bx<R||bx>W-R){vx=-vx;bx=Math.max(R,Math.min(W-R,bx))}
  if(by<R){vy=-vy;by=R}
  if(vy>0&&by>H-30-R&&by<H-20&&Math.abs(bx-px)<pw/2+R){const o=(bx-px)/(pw/2);const sp=Math.min(8,Math.hypot(vx,vy)*1.01);vx=o*sp*.85;vy=-Math.sqrt(Math.max(4,sp*sp-vx*vx))}
  for(const b of bricks){if(!b.a)continue;
    if(bx>b.x-R&&bx<b.x+BW+R&&by>b.y-R&&by<b.y+BH+R){b.a=0;sc+=b.v*10;
      const ox=Math.min(bx-(b.x-R),b.x+BW+R-bx),oy=Math.min(by-(b.y-R),b.y+BH+R-by);ox<oy?vx=-vx:vy=-vy;upd();break}}
  if(!bricks.some(b=>b.a)){bricks.forEach((b,i)=>b.a=1);vx*=1.12;vy*=1.12;park()}
  if(by>H+R){lives--;upd();if(lives<=0)over=true;park()}
}
function draw(){
  x.fillStyle='#0b0b0d';x.fillRect(0,0,W,H);
  for(const b of bricks){if(!b.a)continue;x.fillStyle=`rgba(255,255,255,${.25+b.v*.12})`;x.beginPath();x.roundRect(b.x,b.y,BW,BH,4);x.fill()}
  x.fillStyle='#fff';x.beginPath();x.roundRect(px-pw/2,H-30,pw,10,5);x.fill();
  x.beginPath();x.arc(bx,by,R,0,7);x.fill();
  if(over){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='700 24px ui-monospace,monospace';x.textAlign='center';x.fillText('GAME OVER',W/2,H/2);x.font='13px ui-monospace,monospace';x.fillStyle='#8b8b95';x.fillText('click or space to restart',W/2,H/2+26)}
}
function loop(){step();draw();requestAnimationFrame(loop)}
function setX(cx){const r=c.getBoundingClientRect();px=(cx-r.left)/r.width*W}
c.addEventListener('mousemove',e=>setX(e.clientX));
c.addEventListener('touchmove',e=>{setX(e.touches[0].clientX)},{passive:true});
c.addEventListener('mousedown',launch);c.addEventListener('touchstart',launch,{passive:true});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){launch();e.preventDefault()}});
addEventListener('keyup',e=>keys[e.key]=false);
reset();loop();
</script></body></html>
