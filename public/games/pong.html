<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong</title>
<style>
html,body{margin:0;height:100%;background:#070708;color:#f4f4f5;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{border:1px solid #2b2b32;border-radius:14px;background:#0b0b0d;max-width:94vw;max-height:80vh;cursor:none}
</style></head><body>
<canvas id="c" width="560" height="360"></canvas>
<div style="color:#5a5a63">mouse / touch / W S / arrows · first to 7 · click or space to start</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=560,H=360,PH=72,PWD=10,R=6,WIN=7;
let py=H/2,ay=H/2,bx,by,vx,vy,ps=0,as=0,state='ready',keys={},trail=[],last=0,acc=0,flash=0;
function serve(dir){bx=W/2;by=H/2;const a=Math.random()*.7-.35,sp=5;vx=dir*sp*Math.cos(a);vy=sp*Math.sin(a);trail=[]}
function startGame(){ps=0;as=0;state='play';serve(Math.random()<.5?-1:1)}
function act(){if(state==='ready'||state==='over')startGame()}
function paddleHit(py_,dir){
  const o=Math.max(-1,Math.min(1,(by-py_)/(PH/2)));
  const sp=Math.min(11,Math.hypot(vx,vy)*1.06),ang=o*.85;
  vx=dir*sp*Math.cos(ang);vy=sp*Math.sin(ang);flash=6;
}
function step(){
  if(keys.w||keys.arrowup)py-=6;if(keys.s||keys.arrowdown)py+=6;
  py=Math.max(PH/2,Math.min(H-PH/2,py));
  if(state!=='play'){ay+=(H/2-ay)*.05;return}
  bx+=vx;by+=vy;
  trail.push([bx,by]);if(trail.length>9)trail.shift();
  if(by<R){by=R;vy=-vy}if(by>H-R){by=H-R;vy=-vy}
  if(vx<0&&bx-R<30&&bx>14&&Math.abs(by-py)<PH/2+R){bx=30+R;paddleHit(py,1)}
  if(vx>0&&bx+R>W-30&&bx<W-14&&Math.abs(by-ay)<PH/2+R){bx=W-30-R;paddleHit(ay,-1)}
  const target=vx>0?by+Math.sin(performance.now()/400)*14:H/2;
  const d=target-ay;ay+=Math.max(-4.1,Math.min(4.1,d*.18));
  ay=Math.max(PH/2,Math.min(H-PH/2,ay));
  if(bx<-10){as++;if(as>=WIN)state='over';else serve(1)}
  if(bx>W+10){ps++;if(ps>=WIN)state='over';else serve(-1)}
}
function draw(){
  x.fillStyle='#0b0b0d';x.fillRect(0,0,W,H);
  x.strokeStyle='#23232a';x.setLineDash([8,10]);x.lineWidth=2;x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);
  x.fillStyle='#fff';x.textAlign='center';x.font='800 46px ui-monospace,monospace';
  x.globalAlpha=.9;x.fillText(ps,W/2-60,60);x.fillText(as,W/2+60,60);x.globalAlpha=1;
  trail.forEach(([tx,ty],i)=>{x.fillStyle=`rgba(255,255,255,${i/trail.length*.25})`;x.beginPath();x.arc(tx,ty,R*(i/trail.length),0,7);x.fill()});
  x.fillStyle='#fff';
  x.beginPath();x.roundRect(20,py-PH/2,PWD,PH,5);x.fill();
  x.fillStyle='#bdbdc6';x.beginPath();x.roundRect(W-30,ay-PH/2,PWD,PH,5);x.fill();
  if(state==='play'){x.fillStyle=flash>0?'#fff':'#f1f1f4';if(flash>0)flash--;x.beginPath();x.arc(bx,by,R+(flash>0?2:0),0,7);x.fill()}
  if(state!=='play'){
    x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='800 26px ui-monospace,monospace';
    x.fillText(state==='over'?(ps>as?'YOU WIN':'YOU LOSE'):'PONG',W/2,H/2-6);
    x.font='13px ui-monospace,monospace';x.fillStyle='#8b8b95';x.fillText('click or press space to '+(state==='over'?'play again':'start'),W/2,H/2+22);
  }
}
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.667){acc-=16.667;step()}draw();requestAnimationFrame(loop)}
function setY(cy){const r=c.getBoundingClientRect();py=Math.max(PH/2,Math.min(H-PH/2,(cy-r.top)/r.height*H))}
c.addEventListener('mousemove',e=>setY(e.clientY));
c.addEventListener('touchmove',e=>setY(e.touches[0].clientY),{passive:true});
c.addEventListener('pointerdown',act);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k===' '){e.preventDefault();act()}if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
serve(1);requestAnimationFrame(loop);
</script></body></html>
