<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dash</title>
<style>
html,body{margin:0;height:100%;background:#070708;color:#f4f4f5;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{border:1px solid #2b2b32;border-radius:14px;background:#0b0b0d;max-width:96vw;max-height:70vh;cursor:pointer}
</style></head><body>
<canvas id="c" width="680" height="240"></canvas>
<div style="color:#5a5a63">space / ↑ / tap to jump · ↓ fast fall</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=680,H=240,GY=196,PX=70,P=30;
let y=GY-P,vy=0,obs=[],speed=6,dist=0,best=+localStorage.getItem('dashbest')||0,state='ready',gap=80,acc=0,last=0,off=0,spin=0,deadAt=0;
function reset(){y=GY-P;vy=0;obs=[];speed=6;dist=0;gap=80;state='play';spin=0}
function jump(){
  if(state==='ready'){reset();vy=-12.6;return}
  if(state==='dead'){if(performance.now()-deadAt>400)reset();return}
  if(y>=GY-P-.5)vy=-12.6;
}
function die(){state='dead';deadAt=performance.now();const s=Math.floor(dist/10);if(s>best){best=s;localStorage.setItem('dashbest',best)}}
let fast=false;
function step(){
  if(state!=='play'){off=(off+1.5)%40;return}
  vy+=fast?1.5:.72;y+=vy;spin+=vy<0?.16:0;
  if(y>=GY-P){y=GY-P;vy=0;spin=Math.round(spin/(Math.PI/2))*(Math.PI/2)}
  dist+=speed;speed=Math.min(14,speed+.0016);off=(off+speed)%40;
  gap--;
  if(gap<=0){
    const n=Math.random()<.25?2:1,h=26+Math.random()*34;
    for(let i=0;i<n;i++)obs.push({x:W+20+i*26,w:20+Math.random()*10,h:h+(i?Math.random()*10:0)});
    gap=Math.floor((55+Math.random()*60)*(speed/6)*.9+28);
  }
  obs.forEach(o=>o.x-=speed);obs=obs.filter(o=>o.x>-60);
  for(const o of obs){
    if(PX+P-5>o.x&&PX+5<o.x+o.w&&y+P-3>GY-o.h){die();return}
  }
}
function draw(){
  x.fillStyle='#0b0b0d';x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<14;i++)x.fillRect((i*131-off*.3+W*3)%W,30+(i*37)%110,2,2);
  x.fillStyle='#2b2b32';x.fillRect(0,GY,W,2);
  x.fillStyle='#1b1b21';for(let i=-1;i<W/40+1;i++)x.fillRect(i*40-off,GY+10,18,2);
  obs.forEach(o=>{x.fillStyle='#e9e9ee';x.beginPath();x.roundRect(o.x,GY-o.h,o.w,o.h,[6,6,0,0]);x.fill()});
  x.save();x.translate(PX+P/2,y+P/2);x.rotate(spin);x.fillStyle='#fff';x.beginPath();x.roundRect(-P/2,-P/2,P,P,6);x.fill();
  x.fillStyle='#000';x.fillRect(P/2-12,-P/2+7,5,5);x.restore();
  x.fillStyle='#8b8b95';x.textAlign='right';x.font='700 16px ui-monospace,monospace';
  x.fillText('HI '+String(best).padStart(5,'0')+'   '+String(Math.floor(dist/10)).padStart(5,'0'),W-18,28);
  if(state!=='play'){
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';
    x.font='800 26px ui-monospace,monospace';x.fillText(state==='dead'?'GAME OVER':'DASH',W/2,H/2-14);
    x.font='13px ui-monospace,monospace';x.fillStyle='#8b8b95';x.fillText(state==='dead'?'tap to retry':'tap or press space to start',W/2,H/2+14);
  }
}
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.667){acc-=16.667;step()}draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();if(!e.repeat)jump()}
  if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();fast=true}
});
addEventListener('keyup',e=>{if(e.key==='ArrowDown'||e.key==='s')fast=false});
c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
requestAnimationFrame(loop);
</script></body></html>
