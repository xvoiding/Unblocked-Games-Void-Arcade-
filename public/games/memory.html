<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory</title>
<style>
html,body{margin:0;height:100%;background:#070708;color:#f4f4f5;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;-webkit-user-select:none;user-select:none}
#top{display:flex;gap:20px;align-items:center;color:#8b8b95;letter-spacing:.08em}#top b{color:#fff}
button.rs{background:#fff;color:#000;border:0;border-radius:10px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
#wrap{position:relative}
#g{--s:min(18vmin,96px);display:grid;grid-template-columns:repeat(4,var(--s));gap:10px;padding:12px;background:#0f0f12;border:1px solid #2b2b32;border-radius:16px}
.card{width:var(--s);height:var(--s);perspective:600px;cursor:pointer;background:none;border:0;padding:0}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:linear-gradient(135deg,#1d1d23,#121216);border:1px solid #2b2b32}
.back::after{content:"";width:22%;height:22%;border:2px solid #3a3a43;border-radius:50%}
.card:hover .back{border-color:#555}
.front{background:#f1f1f4;color:#000;font-size:calc(var(--s)*.46);transform:rotateY(180deg)}
.card.d .front{background:#2a2a31;color:#fff}
#msg{position:absolute;inset:0;border-radius:16px;display:none;place-items:center;text-align:center;background:rgba(0,0,0,.7);font-size:22px;font-weight:800;letter-spacing:.08em;line-height:1.6}
</style></head><body>
<div id="top"><span>MOVES <b id="mv">0</b></span><span>TIME <b id="tm">0</b></span><span>BEST <b id="bs">-</b></span><button class="rs" id="rs">New game</button></div>
<div id="wrap"><div id="g"></div><div id="msg"></div></div>
<div style="color:#5a5a63">find all the pairs</div>
<script>
const $=id=>document.getElementById(id),SYM=['●','■','▲','◆','★','✚','♥','♣'];
let deck,pick,busy,moves,matched,t0,tm,best=+localStorage.getItem('membest')||0;
if(best)$('bs').textContent=best;
function start(){
  const d=[...SYM,...SYM];for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
  deck=d;pick=-1;busy=false;moves=0;matched=0;t0=0;clearInterval(tm);$('tm').textContent=0;$('mv').textContent=0;$('msg').style.display='none';
  const g=$('g');g.innerHTML='';
  d.forEach((s,i)=>{const b=document.createElement('button');b.className='card';b.dataset.i=i;
    b.innerHTML=`<div class="in"><div class="face back"></div><div class="face front">${s}</div></div>`;g.appendChild(b)});
}
function flip(i,on){const el=$('g').children[i];el.classList.toggle('f',on)}
$('g').addEventListener('click',e=>{
  const el=e.target.closest('.card');if(!el||busy)return;
  const i=+el.dataset.i;if(el.classList.contains('f'))return;
  if(!t0){t0=Date.now();tm=setInterval(()=>$('tm').textContent=Math.floor((Date.now()-t0)/1000),500)}
  flip(i,true);
  if(pick<0){pick=i;return}
  moves++;$('mv').textContent=moves;const a=pick;pick=-1;
  if(deck[a]===deck[i]){
    $('g').children[a].classList.add('d');$('g').children[i].classList.add('d');matched++;
    if(matched===SYM.length)done();
  }else{busy=true;setTimeout(()=>{flip(a,false);flip(i,false);busy=false},750)}
});
function done(){
  clearInterval(tm);const s=Math.floor((Date.now()-t0)/1000);
  if(!best||moves<best){best=moves;localStorage.setItem('membest',best);$('bs').textContent=best}
  setTimeout(()=>{$('msg').innerHTML='CLEARED<br><span style="font-size:14px;font-weight:600;color:#8b8b95">'+moves+' moves · '+s+'s</span>';$('msg').style.display='grid'},500);
}
$('rs').onclick=start;start();
</script></body></html>
