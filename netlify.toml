[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/go"
  to = "/.netlify/functions/proxy"
  status = 200
  force = true

[[redirects]]
  from = "/icon"
  to = "/.netlify/functions/icon"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true
